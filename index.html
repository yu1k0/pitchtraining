<style>

*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Zen Maru Gothic',sans-serif;background:var(--bg-gradient);background-attachment:fixed;color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:16px;overflow-x:hidden;position:relative;}

.screen{display:none;width:100%;max-width:460px;position:relative;z-index:1;}
.screen.active{display:block;animation:screenIn .38s cubic-bezier(.2,.8,.2,1) both;}
.screen.leaving{display:block;animation:screenOut .20s ease-in both;pointer-events:none;}
@keyframes screenIn{
  from{opacity:0;transform:translateY(18px) scale(.985);}
  to{opacity:1;transform:translateY(0) scale(1);}
}
@keyframes screenOut{
  from{opacity:1;transform:translateY(0) scale(1);}

}

}

let audioCtx,micStream,analyst,source,refOsc,rafId=null,currentLevel=1,qNum=0,totalScore=0,combo=0,refFreq,targetFreq,lastRefFreq=null,startTime,userName="",excelCount=0,greatCount=0,goodCount=0,almostCount=0,resultLog=[],lastDetectedCents=null,noteIntervalId=null,t1=null,t2=null,t3=null,isCustomMode=false,customRootFreq=null,customInterval="fifth";

window.addEventListener('DOMContentLoaded',()=>{const saved=localStorage.getItem('pitch_trainer_user_name');if(saved)document.getElementById('user-name').value=saved;startFallingNotes();});
let screenTransitionTimer=null;
function showScreen(id){
  const next=document.getElementById(id);
  const current=document.querySelector('.screen.active');

  if(!next || current===next)return;

  if(screenTransitionTimer){
    clearTimeout(screenTransitionTimer);
    screenTransitionTimer=null;
  }

  const finish=()=>{
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active','leaving'));
    next.classList.add('active');
    if(id==='screen-menu'||id==='screen-login'||id==='screen-history')startFallingNotes();
    else stopFallingNotes();
  };

  if(current){
    current.classList.add('leaving');
    screenTransitionTimer=setTimeout(()=>{
      finish();
      screenTransitionTimer=null;
    },200);
  }else{
    finish();
  }
}

function startFallingNotes(){const container=document.getElementById('notes-container');container.style.display='block';if(noteIntervalId)return;const notesList=['♩','♪','♫','♬','𝄢','𝄞','♭','♯'];noteIntervalId=setInterval(()=>{const note=document.createElement('div');note.className='falling-note';note.textContent=notesList[Math.floor(Math.random()*notesList.length)];const startX=(window.innerWidth*0.7)+(Math.random()*(window.innerWidth*0.5));note.style.left=startX+'px';note.style.top='-40px';const size=16+Math.random()*18;note.style.fontSize=size+'px';const duration=4.5+Math.random()*4;note.style.animation=`diagonalFall ${duration}s linear forwards`;container.appendChild(note);setTimeout(()=>{note.remove();},duration*1000);},450);}

  if(rafId){cancelAnimationFrame(rafId);rafId=null;}
  if(t1){clearTimeout(t1);t1=null;}

  if(t3){clearTimeout(t3);t3=null;}
  stopRef();
}

  lastDetectedCents=null;
  recentCents=[];
  measurementSamples=[];
  smoothedCents=null;

}

  if(micStream){
    micStream.getTracks().forEach(track=>track.stop());
    micStream=null;
  }
  if(source){
    try{source.disconnect();}catch(e){}
    source=null;
  }
  analyst=null;
  if(audioCtx){
    try{audioCtx.close();}catch(e){}
    audioCtx=null;
  }
}
function median(values){
  if(!values.length)return null;
  const a=values.slice().sort((x,y)=>x-y);
  const mid=Math.floor(a.length/2);
  return a.length%2?a[mid]:(a[mid-1]+a[mid])/2;
}

function getCustomTarget(root,interval){
  if(interval==='fifth')return root*1.5;
  if(interval==='fourth')return root*(4/3);
  if(interval==='major3')return root*1.25;
  if(interval==='minor3')return root*1.2;
  return root;
}
async function startGame(lv){
  clearAllTimers();
  stopMic();
  lastRefFreq=null;
  resetPitchTracking();
  currentLevel=lv;qNum=0;totalScore=0;combo=0;excelCount=0;greatCount=0;goodCount=0;almostCount=0;resultLog=[];
  if(lv!==4)isCustomMode=false;
  document.getElementById('level-purpose-text').textContent=
    lv===4 ? '💡 自分で選んだ根音と音程でハモリを練習します' : levelPurposes[lv];

  const micError=document.getElementById('mic-error');
  micError.style.display='none';
  micError.textContent='';

  showScreen('screen-game');
  setPhase('🎤 マイクを準備しています...','');

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    micError.style.display='block';
    micError.textContent='この表示環境ではマイク機能を利用できません。GitHub Pagesの公開URLをChromeやSafariで開いて試してください。';
    setPhase('マイクを利用できません','');
    return;
  }

  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:true});
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')await audioCtx.resume();
    analyst=audioCtx.createAnalyser();
    analyst.fftSize=2048;
    source=audioCtx.createMediaStreamSource(micStream);
    source.connect(analyst);
  }catch(e){
    micError.style.display='block';

    let msg='マイクを利用できませんでした。ブラウザのマイク許可を確認してください。';
    if(location.protocol!=='https:' && location.hostname!=='localhost'){
      msg='マイクを利用するにはHTTPSで公開する必要があります。GitHub Pagesの公開URLから開いてください。';
    }else if(e && (e.name==='NotAllowedError' || e.name==='SecurityError')){
      msg='マイクへのアクセスが許可されていません。アドレスバー付近のサイト設定から「マイク：許可」にして、ページを再読み込みしてください。';
    }else if(e && e.name==='NotFoundError'){
      msg='利用できるマイクが見つかりませんでした。マイクの接続を確認してください。';
    }

    micError.textContent=msg;
    setPhase('マイクを利用できません','');
    stopMic();
    return;
  }

  nextQuestion();
}
function nextQuestion(){
  clearAllTimers();
  if(qNum>=10)return endGame();
  qNum++;
  resetPitchTracking();
  document.getElementById('q-label').textContent=`課題 ${qNum}/10`;
  document.getElementById('current-score').textContent=totalScore;
  document.getElementById('cent-val').textContent='--';
  document.getElementById('pitch-hint').textContent='';
  document.getElementById('cent-val').className='cent-display';
  document.getElementById('pointer').style.left='50%';
  document.getElementById('countdown-wrap').classList.remove('show');
  document.getElementById('countdown-label').textContent='のこり時間: 3.00秒';
  document.getElementById('prog-fill').style.width='100%';

  const instKey=document.getElementById('user-inst').value;
  const instSetting=instrumentSettings[instKey]||instrumentSettings["flute"];
  const base=instSetting.baseFreq;

  if(isCustomMode){
    refFreq=customRootFreq;
    targetFreq=getCustomTarget(refFreq,customInterval);
  }else{
    let newRefFreq;
    do{
      newRefFreq=base*Math.pow(2,(Math.floor(Math.random()*13)-6)/12);
    }while(lastRefFreq && Math.abs(newRefFreq-lastRefFreq)<1);
    refFreq=newRefFreq;
    lastRefFreq=refFreq;

    if(currentLevel===1)targetFreq=refFreq;
    else if(currentLevel===2)targetFreq=refFreq*Math.pow(2,(Math.random()>0.5?7:-5)/12);
    else targetFreq=refFreq*1.25;
  }

  document.getElementById('ref-note').textContent=freqToNote(refFreq,instKey);
  document.getElementById('target-note').textContent=freqToNote(targetFreq,instKey);
  setPhase('🎵 きほんの音をきいてね...','');
  playRef(refFreq,currentLevel===2 || currentLevel===3 || isCustomMode);

  t1=setTimeout(()=>{
    if(!(currentLevel===2 || currentLevel===3 || isCustomMode))stopRef();
    setPhase((currentLevel===2 || currentLevel===3 || isCustomMode)
      ? '🎤 根音を聴きながら3秒間、まっすぐ演奏してね！'
      : '🎤 3秒間、まっすぐ演奏してね！','');
    document.getElementById('screen-game').classList.add('screen-game-measuring');
    document.getElementById('countdown-wrap').classList.add('show');
    startTime=Date.now();
    resetPitchTracking();
    pitchLoop();
    t2=setTimeout(evaluateFinal,MEASURE_DURATION);
  },2800);
}
function pitchLoop(){
  const now=Date.now();
  const elapsed=now-startTime;
  const remaining=Math.max(0,MEASURE_DURATION-elapsed);

  document.getElementById('countdown-label').textContent=`のこり時間: ${(remaining/1000).toFixed(2)}秒`;
  document.getElementById('prog-fill').style.width=(remaining/MEASURE_DURATION)*100+'%';

  const buf=new Float32Array(analyst.fftSize);
  analyst.getFloatTimeDomainData(buf);
  const freq=autoCorrelate(buf,audioCtx.sampleRate);

  if(freq>40&&freq<2500){
    let cents=1200*Math.log2(freq/targetFreq);
    while(cents>600)cents-=1200;
    while(cents<-600)cents+=1200;

    // 極端な瞬間値を少し抑え、直近の中央値を使ってから滑らかにする
    recentCents.push(cents);
    if(recentCents.length>MEDIAN_WINDOW)recentCents.shift();
    const filtered=median(recentCents);

    if(filtered!==null){
      smoothedCents=smoothedCents===null
        ? filtered
        : smoothedCents+(filtered-smoothedCents)*SMOOTHING_ALPHA;

      lastDetectedCents=smoothedCents;
      measurementSamples.push({time:now,cents:smoothedCents});

      // 表示更新を少し間引くことで、針の細かな震えを抑える
      if(now-lastUiUpdate>=UI_UPDATE_INTERVAL){
        updateUI(smoothedCents);
        lastUiUpdate=now;
      }
    }
  }

  if(remaining>0)rafId=requestAnimationFrame(pitchLoop);
  else rafId=null;
}
function updateUI(diff){
  const el=document.getElementById('cent-val');
  const hint=document.getElementById('pitch-hint');
  el.textContent=(diff>=0?'+':'')+diff.toFixed(1)+' ¢';

  const abs=Math.abs(diff);
  el.className='cent-display '+(abs<=2?'excellent':abs<=10?'perfect':abs<=50?'good':'off');

  if(abs<=2)hint.textContent='✨ ぴったり！そのままキープ';
  else if(diff>0)hint.textContent='↑ 少し高い　→ 少し下げてみよう';
  else hint.textContent='↓ 少し低い　→ 少し上げてみよう';

  document.getElementById('pointer').style.left=Math.max(0,Math.min(100,50+diff))+'%';
}
function evaluateFinal(){
  if(rafId){cancelAnimationFrame(rafId);rafId=null;}
  if(t2){clearTimeout(t2);t2=null;}
  if(currentLevel===2 || currentLevel===3 || isCustomMode)stopRef();
  document.getElementById('screen-game').classList.remove('screen-game-measuring');

  const instKey=document.getElementById('user-inst').value;
  const cutoff=Date.now()-FINAL_WINDOW_MS;
  const tail=measurementSamples.filter(s=>s.time>=cutoff).map(s=>s.cents);
  const stableFinal=median(tail);
  const finalCents=stableFinal!==null?stableFinal:(lastDetectedCents!==null?lastDetectedCents:999);

  if(finalCents===999){
    resultLog.push({q:qNum,note:freqToNote(targetFreq,instKey),diff:"--",result:"音なし 💦",pts:0,tag:"tag-almost"});
    sendToGAS(qNum,"音なし 💦",999,0);
    t3=setTimeout(nextQuestion,1200);
    return;
  }

  const abs=Math.abs(finalCents);
  let resText="",pts=0,tag="";
  if(abs<=2){
    resText="Excellent ✨";pts=50;tag="tag-excellent";excelCount++;
    confetti({particleCount:150,spread:70,origin:{y:0.6}});
  }else if(abs<=10){
    resText="Great 🎯";pts=30;tag="tag-excellent";greatCount++;
    confetti({particleCount:60});
  }else if(abs<=50){
    resText="Good ⭕";pts=20;tag="tag-excellent";goodCount++;
    confetti({particleCount:30});
  }else{
    resText="Almost 💦";pts=10;tag="tag-almost";almostCount++;
  }

  totalScore+=(pts*currentLevel);
  resultLog.push({
    q:qNum,
    note:freqToNote(targetFreq,instKey),
    diff:finalCents.toFixed(1),
    result:resText,
    pts:pts*currentLevel,
    tag:tag
  });
  sendToGAS(qNum,resText,finalCents,pts*currentLevel);
  const resultHint=Math.abs(finalCents)<=2
    ? '✨ その音程！キープしよう'
    : (finalCents>0 ? '少し高め。次はほんの少し下へ' : '少し低め。次はほんの少し上へ');
  document.getElementById('pitch-hint').textContent=resultHint;
  t3=setTimeout(nextQuestion,1400);
}
function passQuestion(){
  document.getElementById('screen-game').classList.remove('screen-game-measuring');
  clearAllTimers();
  const instKey=document.getElementById('user-inst').value;
  resultLog.push({q:qNum,note:freqToNote(targetFreq,instKey),diff:"--",result:"パス 🐾",pts:0,tag:"tag-almost"});
  nextQuestion();
}
function quitGame(){
  document.getElementById('screen-game').classList.remove('screen-game-measuring');
  clearAllTimers();
  stopMic();
  showScreen('screen-menu');
}
function playRef(f,sustain=false){
  stopRef();
  if(!audioCtx)return;

  const osc1=audioCtx.createOscillator();
  const osc2=audioCtx.createOscillator();
  const gainNode=audioCtx.createGain();

  // 耳当たりを少し柔らかくし、Lv.2では根音を小さめに持続させる
  osc1.type='sine';
  osc2.type='triangle';
  osc1.frequency.value=f;
  osc2.frequency.value=f*0.999;

  osc1.connect(gainNode);
  osc2.connect(gainNode);
  gainNode.connect(audioCtx.destination);

  const now=audioCtx.currentTime;
  gainNode.gain.setValueAtTime(0.0001,now);
  gainNode.gain.exponentialRampToValueAtTime(sustain?LV2_ROOT_START_GAIN:0.50,now+0.08);

  if(sustain){
    // 最初はしっかり聴こえる音量、その後もハーモニーを感じやすい音量で持続
    gainNode.gain.setValueAtTime(LV2_ROOT_START_GAIN,now+2.0);
    gainNode.gain.linearRampToValueAtTime(LV2_ROOT_SUSTAIN_GAIN,now+2.7);
  }else{
    gainNode.gain.setValueAtTime(0.50,now+2.0);
    gainNode.gain.linearRampToValueAtTime(0.0001,now+2.5);
  }

  osc1.start();
  osc2.start();

  refOsc={
    osc1,osc2,gainNode,
    stop:()=>{
      try{
        const t=audioCtx ? audioCtx.currentTime : 0;
        gainNode.gain.cancelScheduledValues(t);
        gainNode.gain.setValueAtTime(Math.max(gainNode.gain.value,0.0001),t);
        gainNode.gain.exponentialRampToValueAtTime(0.0001,t+0.06);
        osc1.stop(t+0.08);
        osc2.stop(t+0.08);
      }catch(e){
        try{osc1.stop();}catch(_){}
        try{osc2.stop();}catch(_){}
      }
      setTimeout(()=>{
        try{osc1.disconnect();}catch(e){}
        try{osc2.disconnect();}catch(e){}
        try{gainNode.disconnect();}catch(e){}
      },120);
    }
  };
}
function stopRef(){if(refOsc){try{refOsc.stop();}catch(e){}refOsc=null;}}
function sendToGAS(qn,res,diff,pts){
  if(!GAS_URL)return;
  const instSelect=document.getElementById('user-inst');
  fetch(GAS_URL,{
    method:"POST",
    mode:"no-cors",
    body:JSON.stringify({
      userName,
      instrument:instSelect.value,
      instrumentName:instSelect.options[instSelect.selectedIndex].text,
      qNum:qn,
      result:res,
      diff:diff===999?"--":diff.toFixed(1),
      score:pts,
      level:currentLevel
    })
  });
}
function endGame(){document.getElementById('screen-game').classList.remove('screen-game-measuring');clearAllTimers();stopMic();showScreen('screen-result');document.getElementById('result-score').textContent=totalScore+"点";document.getElementById('res-excellent').textContent=excelCount;document.getElementById('res-perfect').textContent=greatCount;document.getElementById('res-good').textContent=goodCount;document.getElementById('res-try').textContent=almostCount;const tb=document.getElementById('log-tbody');tb.innerHTML="";resultLog.forEach(r=>tb.innerHTML+=`<tr><td>${r.q}</td><td>${r.note}</td><td>${r.diff}¢</td><td><span class="${r.tag}">${r.result}</span></td><td>${r.pts}</td></tr>`);let history=JSON.parse(localStorage.getItem('pitch_trainer_history_v2'))||[];history.push({date:new Date().toLocaleString(),score:totalScore,level:currentLevel,details:resultLog});localStorage.setItem('pitch_trainer_history_v2',JSON.stringify(history));}
function showHistoryScreen(){showScreen('screen-history');const cnt=document.getElementById('history-container');cnt.innerHTML="";let hist=JSON.parse(localStorage.getItem('pitch_trainer_history_v2'))||[];hist.slice().reverse().forEach(h=>{let dRows=h.details.map(d=>`<tr><td>${d.q}</td><td>${d.note}</td><td>${d.diff}¢</td><td>${d.result}</td><td>${d.pts}</td></tr>`).join("");cnt.innerHTML+=`<div class="history-item"><div class="history-summary" onclick="this.parentElement.classList.toggle('open')"><div>${h.date}<br><b>Lv.${h.level}</b></div><b>${h.score}点</b></div><div class="history-details"><table class="log-table"><thead><tr><th>#</th><th>音名</th><th>誤差</th><th>判定</th><th>点</th></tr></thead><tbody>${dRows}</tbody></table></div></div>`;});}
function clearAllHistory(){if(confirm("履歴をすべて消しますか？")){localStorage.removeItem('pitch_trainer_history_v2');showHistoryScreen();}}
function setPhase(m,c){const el=document.getElementById('phase-msg');el.textContent=m;}
function autoCorrelate(buf,sr){let rms=0;for(let i=0;i<buf.length;i++)rms+=buf[i]*buf[i];if(Math.sqrt(rms/buf.length)<0.01)return-1;let c=new Float32Array(buf.length);for(let i=0;i<buf.length;i++)for(let j=0;j<buf.length-i;j++)c[i]+=buf[j]*buf[j+i];let d=0;while(c[d]>c[d+1])d++;let maxVal=-1,maxPos=-1;for(let i=d;i<buf.length;i++)if(c[i]>maxVal){maxVal=c[i];maxPos=i;}return sr/maxPos;}
function freqToNote(f,instKey){const doReMiNames=['ド','ド♯','レ','レ♯','ミ','ファ','ファ♯','ソ','ソ♯','ラ','ラ♯','シ'];const noteNum=Math.round(12*Math.log2(f/440))+57;const inst=instrumentSettings[instKey]||instrumentSettings["flute"];const transposedNoteNum=noteNum+inst.transpose;const noteIndex=((transposedNoteNum%12)+12)%12;return doReMiNames[noteIndex];}
