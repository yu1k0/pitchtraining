<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ピッチ判定アプリ</title>

<style>
body{
    font-family: sans-serif;
    background:#f3f6ff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
}

.card{
    width:90%;
    max-width:420px;
    background:white;
    border-radius:24px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
    text-align:center;
}

h1{
    margin-top:0;
    color:#2c3e6b;
}

.note{
    font-size:56px;
    font-weight:bold;
    color:#2c3e6b;
    margin:10px 0;
}

.status{
    font-size:20px;
    margin:20px 0;
    min-height:30px;
}

.result{
    font-size:42px;
    font-weight:bold;
    margin:20px 0 10px;
}

.detail{
    font-size:18px;
    color:#666;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:16px;
    background:#4ecdc4;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    margin-top:20px;
}

button:disabled{
    opacity:0.5;
}

.gauge{
    width:100%;
    height:24px;
    background:#ddd;
    border-radius:12px;
    margin-top:25px;
    position:relative;
    overflow:hidden;
}

.center-line{
    position:absolute;
    left:50%;
    top:0;
    width:4px;
    height:100%;
    background:#222;
    transform:translateX(-50%);
}

.pointer{
    position:absolute;
    top:0;
    width:6px;
    height:100%;
    background:#ff4757;
    left:50%;
    transform:translateX(-50%);
    transition:left 0.1s linear;
}
</style>
</head>

<body>

<div class="card">

    <h1>🎵 ピッチ判定</h1>

    <div class="note" id="targetNote">A4</div>

    <div class="status" id="status">
        ボタンを押してください
    </div>

    <div class="result" id="result">--</div>
    <div class="detail" id="detail"></div>

    <div class="gauge">
        <div class="center-line"></div>
        <div class="pointer" id="pointer"></div>
    </div>

    <button id="startBtn">スタート</button>

</div>

<script>

const AudioContextClass = window.AudioContext || window.webkitAudioContext;

let audioCtx;
let analyser;
let micStream;

const targetFreq = 440;
const targetNote = "A4";

document.getElementById("targetNote").textContent = targetNote;

const startBtn = document.getElementById("startBtn");

startBtn.addEventListener("click", start);

async function start(){

    startBtn.disabled = true;

    document.getElementById("result").textContent = "--";
    document.getElementById("detail").textContent = "";

    try{

        micStream = await navigator.mediaDevices.getUserMedia({
            audio:true
        });

        audioCtx = new AudioContextClass();

        const source = audioCtx.createMediaStreamSource(micStream);

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;

        source.connect(analyser);

        await audioCtx.resume();

        playReference();

    }catch(e){

        alert("マイクが使用できません");
        startBtn.disabled = false;
    }
}

function playReference(){

    document.getElementById("status").textContent =
        "🎵 基準音を3秒再生しています";

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "triangle";
    osc.frequency.value = targetFreq;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);

    osc.start();

    setTimeout(()=>{

        osc.stop();

        waitBeforeJudge();

    },3000);
}

function waitBeforeJudge(){

    let count = 5;

    document.getElementById("status").textContent =
        `🎤 ${count}秒後に判定します`;

    const interval = setInterval(()=>{

        count--;

        if(count > 0){

            document.getElementById("status").textContent =
                `🎤 ${count}秒後に判定します`;

        }else{

            clearInterval(interval);

            judgePitch();
        }

    },1000);
}

function judgePitch(){

    document.getElementById("status").textContent =
        "🎧 判定中...";

    const buffer = new Float32Array(analyser.fftSize);

    analyser.getFloatTimeDomainData(buffer);

    const freq = autoCorrelate(buffer, audioCtx.sampleRate);

    if(freq === -1){

        document.getElementById("result").textContent =
            "検知失敗";

        document.getElementById("detail").textContent =
            "音が小さい可能性があります";

        startBtn.disabled = false;
        return;
    }

    let cents = 1200 * Math.log2(freq / targetFreq);

    while(cents > 600) cents -= 1200;
    while(cents < -600) cents += 1200;

    showResult(cents);

    startBtn.disabled = false;
}

function showResult(cents){

    const abs = Math.abs(cents);

    let rank = "";
    let msg = "";

    if(abs <= 5){

        rank = "Excellent ✨";
        msg = "かなり正確です";

    }else if(abs <= 15){

        rank = "Great 🎯";
        msg = "よく合っています";

    }else if(abs <= 30){

        rank = "Good ⭕";
        msg = "あと少し";

    }else{

        rank = "Almost 💦";
        msg = "音程がずれています";
    }

    document.getElementById("status").textContent =
        "判定完了";

    document.getElementById("result").textContent =
        rank;

    document.getElementById("detail").textContent =
        `${cents.toFixed(1)} ¢  ${msg}`;

    updateGauge(cents);
}

function updateGauge(cents){

    let pos = 50 + cents;

    pos = Math.max(0, Math.min(100, pos));

    document.getElementById("pointer").style.left =
        pos + "%";
}

function autoCorrelate(buf, sampleRate){

    let SIZE = buf.length;

    let rms = 0;

    for(let i=0;i<SIZE;i++){
        rms += buf[i] * buf[i];
    }

    rms = Math.sqrt(rms / SIZE);

    if(rms < 0.01) return -1;

    let r1 = 0;
    let r2 = SIZE - 1;

    for(let i=0;i<SIZE/2;i++){
        if(Math.abs(buf[i]) < 0.2){
            r1 = i;
            break;
        }
    }

    for(let i=1;i<SIZE/2;i++){
        if(Math.abs(buf[SIZE-i]) < 0.2){
            r2 = SIZE - i;
            break;
        }
    }

    buf = buf.slice(r1, r2);
    SIZE = buf.length;

    let c = new Array(SIZE).fill(0);

    for(let i=0;i<SIZE;i++){
        for(let j=0;j<SIZE-i;j++){
            c[i] += buf[j] * buf[j+i];
        }
    }

    let d = 0;

    while(c[d] > c[d+1]) d++;

    let maxval = -1;
    let maxpos = -1;

    for(let i=d;i<SIZE;i++){

        if(c[i] > maxval){

            maxval = c[i];
            maxpos = i;
        }
    }

    let T0 = maxpos;

    return sampleRate / T0;
}

</script>

</body>
</html>
